name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

# GITHUB_TOKEN 권한 최소화 (체크아웃만 필요)
permissions:
  contents: read

# 연속 배포 시 이전 실행은 취소하되, 진행 중인 배포는 끝까지 완료
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: build / s3 sync / invalidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 필드를 따름
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Sync to S3
        run: aws s3 sync dist/ s3://hearo-frontend-2026 --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1DVZVZ7AGWB70 --paths "/*"
